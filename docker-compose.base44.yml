services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./:/app
    ports:
      - "3000:5000"
    environment:
      # parola default de boot; poate fi suprascrisa din /run/base44/app.env
      - OPTIFORGE_ADMIN_PASS=schimba-parola-asta
      - PYTHONUNBUFFERED=1
    env_file:
      - /run/base44/app.env
    command: >
      sh -c "pip install --no-cache-dir -q -r requirements.txt &&
             python -c 'from app import init_db; init_db()' &&
             flask --app app run --debug --host 0.0.0.0 --port 5000"
    restart: unless-stopped
